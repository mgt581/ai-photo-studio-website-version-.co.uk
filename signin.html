<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sign In • AI Photo Studio</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { display:flex; justify-content:center; align-items:center; }
    .box { width:100%; max-width:420px; padding:28px; border-radius:16px; text-align:center; }
    h2 { margin:0; color:var(--aips-text); font-size:28px; }
    .subtitle { color:var(--aips-secondary); font-size:14px; margin:8px 0 22px; }
    input { width:100%; padding:13px 14px; margin-bottom:12px; border:1px solid var(--aips-border); border-radius:12px; box-sizing:border-box; font-size:16px; background:rgba(255,255,255,.05); color:var(--aips-text); }
    input::placeholder { color:var(--aips-muted); }

    .btn { width:100%; padding:13px; border:1px solid var(--aips-border); border-radius:14px; cursor:pointer; font-size:16px; font-weight:800; margin-bottom:14px; display:flex; align-items:center; justify-content:center; }
    .btn-primary { background:var(--aips-primary); color:white; box-shadow:0 16px 34px rgba(37,99,235,.28); }
    .btn-primary:hover { filter:brightness(1.06); }

    .btn-google { background:rgba(255,255,255,.05); color:var(--aips-text); border:1px solid var(--aips-border); }
    .btn-google:hover { background:rgba(255,255,255,.09); }

    .or { margin: 16px 0; color:var(--aips-muted); font-size:14px; position: relative; }
    .or::before, .or::after { content: ""; display: block; height: 1px; background: var(--aips-border); position: absolute; top: 50%; width: 42%; }
    .or::before { left: 0; }
    .or::after { right: 0; }

    .links { display:flex; justify-content:space-between; font-size:14px; margin-top:15px; }
    .link { color:#93C5FD; text-decoration:none; font-weight:700; cursor:pointer; }
    .link:hover { text-decoration:underline; }
    .back { display:block; margin-top:30px; color:var(--aips-muted); text-decoration:none; font-size:14px; }
    .auth-message { color:var(--aips-secondary); font-size:14px; }
    .links button.link { background:none; border:0; padding:0; font:inherit; }
    .legal { margin-top:22px; color:var(--aips-muted); font-size:12px; }
    .legal a { color:#93C5FD; text-decoration:none; margin:0 8px; }
    .legal a:hover { text-decoration:underline; }
  </style>
</head>
<body class="aips-page">

  <div class="box aips-card">
    <h1>AI Photo Studio</h1>
    <h2>Sign in to your account</h2>
    <p class="subtitle">Welcome back to AI Photo Studio</p>

    <button class="btn btn-google" type="button" onclick="googleLogin()">Continue with Google</button>

    <div class="or">OR</div>

    <form id="authForm" method="post" onsubmit="event.preventDefault(); signIn()">
    <input type="email" id="email" placeholder="Email Address" autocomplete="email" aria-label="Email address" required>
    <input type="password" id="password" placeholder="Password" autocomplete="current-password" aria-label="Password" required>

    <button class="btn btn-primary" type="submit">Sign In</button>

    </form>
    <p id="authMessage" class="auth-message" role="status" aria-live="polite"></p>

    <div class="links">
      <a href="signup.html" class="link">Create Account</a>
      <button type="button" class="link" onclick="forgotPassword()">Forgot Password?</button>
    </div>

    <a href="app.html" class="back">← Back to Studio</a>
    <p class="legal">By continuing, you agree to the <a href="terms.html">Terms</a> and acknowledge the <a href="privacy.html">Privacy Policy</a>.</p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCM6r66kW9xkBA5rgVcz4sP57N2v2BMbkg",
      authDomain: "ai-photo-studio-24354.firebaseapp.com",
      projectId: "ai-photo-studio-24354",
      // UPDATED BUCKET NAME BELOW:
      storageBucket: "ai-photo-studio-24354.firebasestorage.app",
      messagingSenderId: "411346648650",
      appId: "1:411346648650:web:5ecd86ffecd05472fab0b3",
      measurementId: "G-R3G160W8BQ"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    let authBusy = false;

    function showAuthError(error) {
      const messages = {
        'auth/invalid-email': 'Please enter a valid email address.',
        'auth/invalid-login-credentials': 'Email or password is incorrect. Try again or reset your password.',
        'auth/invalid-credential': 'Email or password is incorrect. Try again or reset your password.',
        'auth/wrong-password': 'Email or password is incorrect. Try again or reset your password.',
        'auth/user-not-found': 'Email or password is incorrect. Try again or reset your password.',
        'auth/email-already-in-use': 'An account already uses this email. Sign in or reset its password instead.',
        'auth/account-exists-with-different-credential': 'Use your original sign-in method for this email to keep access to your existing account.',
        'auth/weak-password': 'Please choose a stronger password (at least 6 characters).',
        'auth/popup-blocked': 'Please allow the Google sign-in popup and try again.',
        'auth/popup-closed-by-user': 'Google sign-in was cancelled. Please try again.',
        'auth/cancelled-popup-request': 'Google sign-in was cancelled. Please try again.',
        'auth/unauthorized-domain': 'Sign-in is not enabled for this website address. Please contact support.',
        'auth/network-request-failed': 'Could not connect. Check your connection and try again.',
        'auth/too-many-requests': 'Too many attempts. Please wait before trying again.'
      };
      document.getElementById('authMessage').textContent = messages[error.code] || 'Sign-in could not be completed. Please try again or contact support.';
    }

    function runAuth(action) {
      if (authBusy) return;
      authBusy = true;
      document.getElementById('authMessage').textContent = '';
      document.querySelectorAll('button').forEach(button => button.disabled = true);
      // Invoke immediately so Google opens its popup within the user's click gesture.
      return action()
        .then(() => window.location.assign('/app'))
        .catch(showAuthError)
        .finally(() => {
          authBusy = false;
          document.querySelectorAll('button').forEach(button => button.disabled = false);
        });
    }

    function signIn() {
      if (!document.getElementById('authForm').reportValidity()) return;
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      return runAuth(() => auth.signInWithEmailAndPassword(email, password));
    }

    function googleLogin() {
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' });
      return runAuth(() => auth.signInWithPopup(provider));
    }

    async function forgotPassword() {
      if (authBusy) return;
      const email = prompt('Enter your AI Photo Studio account email to reset its password:', document.getElementById('email').value.trim());
      if (email === null || !email.trim()) return;
      const validator = document.createElement('input');
      validator.type = 'email';
      validator.value = email.trim();
      if (!validator.checkValidity()) return showAuthError({ code: 'auth/invalid-email' });
      authBusy = true;
      document.querySelectorAll('button').forEach(button => button.disabled = true);
      try {
        await auth.sendPasswordResetEmail(email.trim());
        document.getElementById('authMessage').textContent = 'If an account exists for this email, a reset link has been sent. Check your inbox.';
      } catch (error) {
        if (error.code === 'auth/user-not-found') {
          document.getElementById('authMessage').textContent = 'If an account exists for this email, a reset link has been sent. Check your inbox.';
        } else showAuthError(error);
      } finally {
        authBusy = false;
        document.querySelectorAll('button').forEach(button => button.disabled = false);
      }
    }
  </script>

</body>
</html>
